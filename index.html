<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>人说山西好风光</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  background: #1a1a1a;
  height: 100vh;
  overflow: hidden;
}

/* 顶栏 */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  padding: 52px 20px 14px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
  pointer-events: none;
}
.topbar-title {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 1px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.topbar-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  margin-top: 2px;
}

/* 地图容器 */
#amap {
  width: 100%;
  height: 100vh;
}

/* 城市标记自定义样式 */
.city-marker {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.2s;
}
.city-marker:active { transform: scale(0.92); }
.city-dot {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 3px solid #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  position: relative;
}
.city-dot::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-top: 8px solid var(--dot-color);
}
.city-name-tag {
  margin-top: 10px;
  background: rgba(255,255,255,0.95);
  color: #1a1a1a;
  font-size: 12px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  white-space: nowrap;
}

/* 底部行程生成按钮 */
.fab-plan {
  position: fixed;
  bottom: 32px;
  right: 20px;
  z-index: 200;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  border: none;
  border-radius: 28px;
  padding: 14px 22px;
  font-size: 15px;
  font-weight: 700;
  box-shadow: 0 6px 24px rgba(102,126,234,0.5);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 抽屉 */
.drawer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 300;
  background: #fff;
  border-radius: 24px 24px 0 0;
  max-height: 85vh;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.drawer.open { transform: translateY(0); }
.drawer-handle {
  width: 36px; height: 4px;
  background: #ddd;
  border-radius: 2px;
  margin: 12px auto 0;
  flex-shrink: 0;
}
.drawer-header {
  padding: 12px 20px 0;
  flex-shrink: 0;
}
.drawer-city-name {
  font-size: 22px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
}
.drawer-city-hint {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}

/* 分类 Tag 筛选 */
.drawer-tabs {
  display: flex;
  gap: 8px;
  padding: 14px 20px;
  overflow-x: auto;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
}
.drawer-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 7px 16px;
  border-radius: 20px;
  border: 1.5px solid #e0e0e0;
  background: #fff;
  font-size: 13px;
  font-weight: 600;
  color: #666;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  flex-shrink: 0;
}
.tab-btn.active {
  border-color: transparent;
  color: #fff;
}

/* POI 列表 */
.drawer-body {
  overflow-y: auto;
  flex: 1;
  padding: 0 20px 32px;
  -webkit-overflow-scrolling: touch;
}

.poi-section-title {
  font-size: 13px;
  font-weight: 700;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 16px 0 10px;
}

.poi-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid #f0f0f0;
}
.poi-item:last-child { border-bottom: none; }
.poi-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.poi-info { flex: 1; }
.poi-name {
  font-size: 15px;
  font-weight: 600;
  color: #1a1a1a;
}
.poi-note {
  font-size: 12px;
  color: #888;
  margin-top: 3px;
  line-height: 1.5;
}
.poi-check {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid #ddd;
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.poi-check.checked {
  background: var(--city-color);
  border-color: var(--city-color);
  color: #fff;
  font-size: 13px;
}

/* 行程参考 */
.trip-day {
  margin-bottom: 16px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #f0f0f0;
}
.trip-day-header {
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}
.trip-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid #f8f8f8;
}
.trip-item:last-child { border-bottom: none; }
.trip-time-tag {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 8px;
  white-space: nowrap;
  flex-shrink: 0;
  color: #fff;
}
.trip-text {
  font-size: 13px;
  color: #333;
  line-height: 1.6;
  padding-top: 2px;
}

/* 遮罩 */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 250;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.overlay.show { opacity: 1; pointer-events: auto; }

/* AI 行程弹窗 */
.ai-modal {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: flex;
  align-items: flex-end;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
.ai-modal.open { pointer-events: auto; opacity: 1; }
.ai-modal-box {
  background: #fff;
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow: hidden;
}
.ai-modal.open .ai-modal-box { transform: translateY(0); }
.ai-modal-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid #f0f0f0;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ai-modal-title { font-size: 17px; font-weight: 800; }
.ai-modal-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: #f0f0f0;
  border: none;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.ai-modal-body {
  overflow-y: auto;
  flex: 1;
  padding: 16px 20px 32px;
  -webkit-overflow-scrolling: touch;
}

/* 行程规划表单弹窗 */
.plan-modal {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: flex;
  align-items: flex-end;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
.plan-modal.open { pointer-events: auto; opacity: 1; }
.plan-modal-box {
  background: #fff;
  border-radius: 24px 24px 0 0;
  width: 100%;
  padding: 20px 20px 40px;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.plan-modal.open .plan-modal-box { transform: translateY(0); }
.plan-modal-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
.form-row { margin-bottom: 16px; }
.form-label { font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 600; }
.form-input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #e8e8e8;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus { border-color: #667eea; }
.form-submit {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}

/* 加载动画 */
@keyframes spin { to { transform: rotate(360deg); } }
.loading-spinner {
  width: 36px; height: 36px;
  border: 3px solid #f0f0f0;
  border-top-color: #667eea;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 40px auto;
}

/* 行程卡片 */
.plan-day-card {
  margin-bottom: 20px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.plan-day-header {
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
}
.plan-slot {
  display: flex;
  gap: 10px;
  padding: 11px 16px;
  border-bottom: 1px solid #f5f5f5;
  align-items: flex-start;
}
.plan-slot:last-child { border-bottom: none; }
.plan-slot-time {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 8px;
  color: #fff;
  white-space: nowrap;
  flex-shrink: 0;
}
.plan-slot-icon { font-size: 18px; flex-shrink: 0; padding-top: 1px; }
.plan-slot-body { flex: 1; }
.plan-slot-title { font-size: 14px; font-weight: 700; color: #1a1a1a; }
.plan-slot-desc { font-size: 12px; color: #555; margin-top: 3px; line-height: 1.6; }
.plan-slot-tip {
  font-size: 11px;
  color: #888;
  margin-top: 4px;
  padding: 4px 8px;
  background: #f8f8f8;
  border-radius: 6px;
}
</style>
</head>

  </div>
</div>

  { key: 'food', label: '🍜 美食', icon: '🍜', bg: '#fff5ee' },

let currentTab = 'food';

// ==================== 高德地图初始化 ====================
function initMap() {
  var map = new AMap.Map('amap', {
    center: [112.0, 37.5],
    zoom: 7,
    mapStyle: 'amap://styles/whitesmoke',
    resizeEnable: true,
  });

  CITIES.forEach(function(city) {
    // 自定义 HTML 标记
    var content = [
      '<div class="city-marker" onclick="openCityDrawer(\'' + city.key + '\')">',
      '  <div class="city-dot" style="background:' + city.color + ';--dot-color:' + city.color + '">',
      '    ' + city.name,
      '  </div>',
      '  <div class="city-name-tag">' + city.hint.split('·')[0].trim() + '</div>',
      '</div>'
    ].join('');

    var marker = new AMap.Marker({
      position: new AMap.LngLat(city.lng, city.lat),
      content: content,
      offset: new AMap.Pixel(-22, -22),
      zIndex: 100,
    });
    map.add(marker);
  });
}

// ==================== 抽屉逻辑 ====================
function openCityDrawer(cityKey) {
  currentCity = CITIES.find(function(c){ return c.key === cityKey; });
  if (!currentCity) return;
  currentTab = 'food';

  document.getElementById('drawerCityName').innerHTML =
    '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:' + currentCity.color + ';margin-right:8px"></span>' + currentCity.name;
  document.getElementById('drawerCityHint').textContent = currentCity.hint;

  renderTabs();
  renderTabContent();

  document.getElementById('cityDrawer').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

function renderTabs() {
  var html = '';
  TAB_CONFIG.forEach(function(tab) {
    var arr = currentCity[tab.key] || [];
    if (arr.length === 0) return;
    var active = tab.key === currentTab ? 'active" style="background:' + currentCity.color + ';border-color:' + currentCity.color : '';
    html += '<button class="tab-btn ' + active + '" onclick="switchTab(\'' + tab.key + '\')" type="button">' + tab.label + '</button>';
  });
  document.getElementById('drawerTabs').innerHTML = html;
}

function switchTab(key) {
  currentTab = key;
  renderTabs();
  renderTabContent();
  document.getElementById('drawerBody').scrollTop = 0;
}

function renderTabContent() {
  var body = document.getElementById('drawerBody');
  if (currentTab === 'trips') {
    renderTrips(body);
    return;
  }
  var items = currentCity[currentTab] || [];
  if (items.length === 0) {
    body.innerHTML = '<div style="text-align:center;color:#ccc;padding:40px 0;font-size:14px">暂无内容</div>';
    return;
  }
  var tab = TAB_CONFIG.find(function(t){ return t.key === currentTab; });
  var html = '';
  items.forEach(function(item, idx) {
    var ckKey = currentCity.key + ':' + currentTab + ':' + idx;
    var checked = checkedItems[ckKey];
    html += '<div class="poi-item">';
    html += '  <div class="poi-icon" style="background:' + tab.bg + '">' + tab.icon + '</div>';
    html += '  <div class="poi-info">';
    html += '    <div class="poi-name">' + item.name + '</div>';
    if (item.note) html += '    <div class="poi-note">' + item.note + '</div>';
    html += '  </div>';
    html += '  <div class="poi-check ' + (checked ? 'checked' : '') + '" style="--city-color:' + currentCity.color + '" onclick="toggleCheck(\'' + ckKey + '\',this)">' + (checked ? '✓' : '') + '</div>';
    html += '</div>';
  });
  body.innerHTML = html;
}

function toggleCheck(key, el) {
  if (checkedItems[key]) {
    delete checkedItems[key];
    el.classList.remove('checked');
    el.textContent = '';
  } else {
    checkedItems[key] = true;
    el.classList.add('checked');
    el.textContent = '✓';
  }
  localStorage.setItem('sx_checked', JSON.stringify(checkedItems));
}

function renderTrips(body) {
  var trips = currentCity.trips || [];
  if (trips.length === 0) {
    body.innerHTML = '<div style="text-align:center;color:#ccc;padding:40px 0;font-size:14px">行程规划整理中</div>';
    return;
  }
  var html = '';
  trips.forEach(function(trip) {
    html += '<div style="margin-bottom:8px;font-size:15px;font-weight:800;padding:12px 0 4px">' + trip.title + '</div>';
    trip.days.forEach(function(day, di) {
      var dayColor = DAY_COLORS[di % DAY_COLORS.length];
      html += '<div class="trip-day">';
      html += '  <div class="trip-day-header" style="background:' + dayColor + '">';
      html += '    ' + day.label + (day.theme ? ' · ' + day.theme : '');
      html += '  </div>';
      day.items.forEach(function(item) {
        var tc = TIME_COLORS[item.time] || '#888';
        html += '<div class="trip-item">';
        html += '  <span class="trip-time-tag" style="background:' + tc + '">' + item.time + '</span>';
        html += '  <span class="trip-text">' + item.text + '</span>';
        html += '</div>';
      });
      html += '</div>';
    });
  });
  body.innerHTML = html;
}

function closeAll() {
  document.getElementById('cityDrawer').classList.remove('open');
  document.getElementById('planModal').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ==================== AI 行程生成 ====================
function openPlanModal() {
  document.getElementById('planModal').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

function closeAiModal() {
  document.getElementById('aiModal').classList.remove('open');
}

async function generateItinerary() {
  var origin = document.getElementById('pfOrigin').value.trim();
  var date = document.getElementById('pfDate').value;
  var days = parseInt(document.getElementById('pfDays').value) || 5;
  if (!origin) { alert('请填写出发城市'); return; }
  if (!date) { alert('请填写出发日期'); return; }

  // 收集已勾选内容
  var checked = [];
  Object.keys(checkedItems).forEach(function(k) {
    var parts = k.split(':');
    var city = CITIES.find(function(c){ return c.key === parts[0]; });
    if (!city) return;
    var tab = parts[1];
    var idx = parseInt(parts[2]);
    var arr = city[tab] || [];
    if (arr[idx]) checked.push(city.name + '/' + arr[idx].name);
  });

  document.getElementById('planModal').classList.remove('open');
  document.getElementById('aiModal').classList.add('open');
  document.getElementById('aiModalBody').innerHTML = '<div class="loading-spinner"></div><div style="text-align:center;color:#aaa;font-size:13px;margin-top:12px">AI 正在规划中…</div>';

  var prompt = '你是山西旅游专家。请为用户生成一份详细的山西旅行行程安排。\n\n用户信息：\n- 出发地：' + origin + '\n- 出发日期：' + date + '\n- 行程天数：' + days + '天\n' + (checked.length ? '- 用户感兴趣的地方：' + checked.join('、') + '\n' : '') + '\n请严格按以下JSON格式输出，不要输出任何其他内容：\n[\n  {\n    "day": 1,\n    "date": "具体日期",\n    "theme": "当天主题",\n    "slots": [\n      {"time":"交通","icon":"🚆","title":"出发","desc":"交通方式+时长+票价","tip":"实用建议"},\n      {"time":"上午","icon":"🏛","title":"景点名","desc":"具体内容","tip":"实用建议"}\n    ]\n  }\n]\n\n要求：\n1. 第1天第一个slot必须是从' + origin + '到第一个城市的交通\n2. 城市间转场必须有交通slot（时间字段写"交通"）\n3. 每天4-5个slot（上午/中午/下午/晚上）\n4. tip字段为口语化实用建议\n5. 合理分配城市，行程紧凑但不赶';

  try {
    var resp = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DEEPSEEK_KEY },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [{ role: 'user', content: prompt }],
        max_tokens: 3000, temperature: 0.7
      })
    });
    var data = await resp.json();
    var text = data.choices[0].message.content.trim();
    var jsonStr = text.replace(/^```json?\n?/, '').replace(/\n?```$/, '').trim();
    var plan = JSON.parse(jsonStr);
    renderPlanCards(plan);
  } catch(e) {
    document.getElementById('aiModalBody').innerHTML = '<div style="color:#e74c3c;padding:20px;font-size:13px">生成失败，请重试：' + e + '</div>';
  }
}

function renderPlanCards(plan) {
  var html = '';
  plan.forEach(function(day, di) {
    var color = DAY_COLORS[di % DAY_COLORS.length];
    html += '<div class="plan-day-card">';
    html += '<div class="plan-day-header" style="background:' + color + '">Day ' + day.day + ' · ' + day.date + '　' + day.theme + '</div>';
    (day.slots || []).forEach(function(slot) {
      var tc = TIME_COLORS[slot.time] || '#888';
      html += '<div class="plan-slot">';
      html += '  <span class="plan-slot-time" style="background:' + tc + '">' + slot.time + '</span>';
      html += '  <span class="plan-slot-icon">' + (slot.icon || '') + '</span>';
      html += '  <div class="plan-slot-body">';
      html += '    <div class="plan-slot-title">' + slot.title + '</div>';
      if (slot.desc) html += '    <div class="plan-slot-desc">' + slot.desc + '</div>';
      if (slot.tip) html += '    <div class="plan-slot-tip">💡 ' + slot.tip + '</div>';
      html += '  </div></div>';
    });
    html += '</div>';
  });
  document.getElementById('aiModalBody').innerHTML = html;
}
