<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星期一攻略</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  height: 100vh; overflow: hidden;
}
#amap { width: 100%; height: 100vh; }

.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  padding: 52px 20px 14px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 100%);
  pointer-events: none;
}
.topbar-title { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
.topbar-sub { font-size: 12px; color: rgba(255,255,255,.7); margin-top: 2px; }

/* 城市标记 */
.city-marker { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
.city-dot {
  width:44px; height:44px; border-radius:50%; border:3px solid #fff;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:#fff;
  box-shadow: 0 4px 16px rgba(0,0,0,.35);
  position:relative;
}
.city-dot::after {
  content:''; position:absolute; bottom:-9px; left:50%; transform:translateX(-50%);
  border-left:6px solid transparent; border-right:6px solid transparent;
  border-top:9px solid var(--c);
}
.city-label {
  margin-top:12px; background:rgba(255,255,255,.95); color:#111;
  font-size:12px; font-weight:600; padding:3px 8px; border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.18); white-space:nowrap;
}

/* 全局行程按钮 */
.global-plan-btn {
  position:fixed; bottom:32px; right:20px; z-index:200;
  background:linear-gradient(135deg,#3a7a3a,#2d5a2d);
  color:#fff; border:none; border-radius:28px;
  padding:14px 22px; font-size:15px; font-weight:700;
  box-shadow:0 6px 24px rgba(58,122,58,.45); cursor:pointer;
  display:none; align-items:center; gap:8px;
}
.global-plan-badge {
  background:#fff; color:#3a7a3a; border-radius:12px;
  padding:1px 8px; font-size:13px; font-weight:800;
}

/* 遮罩 */
.overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:300;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.overlay.open { opacity:1; pointer-events:auto; }

/* 抽屉 */
.drawer {
  position:fixed; bottom:0; left:0; right:0; z-index:400;
  background:#fff; border-radius:24px 24px 0 0;
  max-height:85vh; transform:translateY(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column; overflow:hidden;
}
.drawer.open { transform:translateY(0); }
.drawer-handle { width:36px; height:4px; background:#ddd; border-radius:2px; margin:12px auto 0; flex-shrink:0; }
.drawer-top { padding:10px 20px 0; flex-shrink:0; }
.drawer-city-row { display:flex; align-items:center; gap:10px; }
.drawer-icon { width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; }
.drawer-name { font-size:22px; font-weight:800; }
.drawer-hint { font-size:12px; color:#888; margin-top:3px; }

/* 分类 Tab */
.drawer-tabs {
  display:flex; gap:8px; padding:12px 20px;
  overflow-x:auto; flex-shrink:0; -webkit-overflow-scrolling:touch;
}
.drawer-tabs::-webkit-scrollbar { display:none; }
.tab-btn {
  padding:7px 16px; border-radius:20px; border:1.5px solid #e0e0e0;
  background:#fff; font-size:13px; font-weight:600; color:#666;
  cursor:pointer; white-space:nowrap; flex-shrink:0; transition:all .2s;
}
.tab-btn.active { border-color:transparent; color:#fff; }

/* 抽屉内容 */
.drawer-body {
  overflow-y:auto; flex:1; padding:0 20px 32px; -webkit-overflow-scrolling:touch;
}
.drawer-section-title {
  font-size:12px; font-weight:700; color:#aaa; text-transform:uppercase;
  letter-spacing:.5px; margin:16px 0 8px;
}
.drawer-item {
  display:flex; align-items:flex-start; gap:10px;
  padding:11px 0; border-bottom:1px solid #f0f0f0; cursor:pointer;
}
.drawer-item:last-child { border-bottom:none; }
.check-box {
  width:20px; height:20px; border-radius:50%; border:1.5px solid #ddd;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; color:transparent; flex-shrink:0; margin-top:2px;
  transition:all .2s;
}
.drawer-item.checked .check-box { background:var(--city-color); border-color:var(--city-color); color:#fff; }
.item-name { font-size:14px; font-weight:600; color:#1a1a1a; }
.item-note { font-size:12px; color:#888; margin-top:2px; line-height:1.5; white-space:pre-line; }

/* 三日游 */
.trip-card { margin-bottom:8px; }
.trip-title { font-size:15px; font-weight:800; padding:12px 0 6px; }
.trip-day { border-radius:14px; overflow:hidden; border:1px solid #f0f0f0; margin-bottom:10px; }
.trip-day-header { padding:9px 14px; font-size:13px; font-weight:700; color:#fff; }
.trip-item { display:flex; align-items:flex-start; gap:8px; padding:9px 14px; border-bottom:1px solid #f8f8f8; }
.trip-item:last-child { border-bottom:none; }
.trip-time { font-size:11px; font-weight:700; padding:2px 8px; border-radius:8px; color:#fff; white-space:nowrap; flex-shrink:0; }
.trip-text { font-size:13px; color:#333; line-height:1.6; padding-top:1px; }

/* 留言 */
.comment-section-title { font-size:12px; font-weight:700; color:#aaa; letter-spacing:.5px; margin:20px 0 10px; }
.comment-card { background:#f8f8f8; border-radius:10px; padding:10px 12px; margin-bottom:8px; }
.comment-meta { font-size:11px; color:#aaa; margin-bottom:4px; }
.comment-text { font-size:13px; color:#333; line-height:1.6; }
.comment-input {
  width:100%; border:1.5px solid #e0e0e0; border-radius:10px;
  padding:10px 12px; font-size:14px; resize:none; outline:none;
  font-family:inherit; margin-bottom:8px;
}
.comment-input:focus { border-color:#3a7a3a; }
.comment-submit {
  float:right; background:#3a7a3a; color:#fff; border:none;
  border-radius:10px; padding:8px 20px; font-size:14px; font-weight:600; cursor:pointer;
}
.login-bar { background:#f5f5f5; border-radius:10px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; }
.login-btn { background:#3a7a3a; color:#fff; border:none; border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; }

/* 行程规划弹窗 */
.plan-form-overlay {
  position:fixed; inset:0; z-index:500; background:rgba(0,0,0,.45);
  display:flex; align-items:flex-end;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.plan-form-overlay.open { opacity:1; pointer-events:auto; }
.plan-form-modal {
  background:#fff; border-radius:24px 24px 0 0; width:100%;
  padding:24px 20px 44px; position:relative;
  transform:translateY(100%); transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.plan-form-overlay.open .plan-form-modal { transform:translateY(0); }
.plan-form-close { position:absolute; top:16px; right:16px; background:#f0f0f0; border:none; border-radius:50%; width:30px; height:30px; font-size:16px; cursor:pointer; }
.plan-form-title { font-size:18px; font-weight:800; margin-bottom:20px; }
.plan-form-row { margin-bottom:14px; }
.plan-form-label { font-size:13px; color:#666; font-weight:600; margin-bottom:5px; display:block; }
.plan-form-input { width:100%; padding:11px 14px; border:1.5px solid #e8e8e8; border-radius:12px; font-size:15px; outline:none; font-family:inherit; }
.plan-form-input:focus { border-color:#3a7a3a; }
.plan-form-submit { width:100%; padding:14px; background:linear-gradient(135deg,#3a7a3a,#2d5a2d); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; margin-top:6px; }

/* AI 弹窗 */
.ai-modal-overlay {
  position:fixed; inset:0; z-index:500; background:rgba(0,0,0,.45);
  display:flex; align-items:flex-end;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.ai-modal-overlay.open { opacity:1; pointer-events:auto; }
.ai-modal {
  background:#fff; border-radius:24px 24px 0 0; width:100%;
  max-height:90vh; display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.ai-modal-overlay.open .ai-modal { transform:translateY(0); }
.ai-modal-header {
  padding:16px 20px 12px; border-bottom:1px solid #f0f0f0;
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
}
.ai-modal-title { font-size:17px; font-weight:800; }
.ai-modal-close { background:#f0f0f0; border:none; border-radius:50%; width:30px; height:30px; font-size:16px; cursor:pointer; }
.ai-modal-body { overflow-y:auto; flex:1; padding:16px 20px 32px; -webkit-overflow-scrolling:touch; }

/* 昵称弹窗 */
.username-modal-overlay {
  position:fixed; inset:0; z-index:600; background:rgba(0,0,0,.45);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.username-modal-overlay.open { opacity:1; pointer-events:auto; }
.username-modal { background:#fff; border-radius:20px; padding:28px 24px; width:88%; max-width:340px; }
.username-modal h3 { font-size:18px; font-weight:800; margin-bottom:6px; }
.username-modal p { font-size:13px; color:#888; margin-bottom:16px; }
.username-modal input { width:100%; padding:12px 14px; border:1.5px solid #e0e0e0; border-radius:12px; font-size:15px; outline:none; font-family:inherit; margin-bottom:14px; }
.username-modal input:focus { border-color:#3a7a3a; }
.uname-btn { width:100%; padding:13px; background:#3a7a3a; color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
</style>
</head>

    </div>
    <div id="pfSelectedSummary" style="font-size:12px;color:#888;margin-bottom:12px"></div>
    <button class="plan-form-submit" onclick="generateGlobalItinerary()" type="button">✨ 开始生成行程</button>
  </div>
</div>

function initMap() {
  var map = new AMap.Map('amap', {
    center:[107.0,33.0], zoom:5,
    mapStyle:'amap://styles/whitesmoke',
    resizeEnable:true,
  });
  CITIES.forEach(function(city){

    el.innerHTML = '<div class="city-dot" style="background:'+city.color+';--c:'+city.color+'">'+city.name+'</div>'

/* ===== 抽屉 ===== */
function openDrawer(cityKey) {
  currentCity = CITIES.find(function(c){return c.key===cityKey;});
  if (!currentCity) return;
  currentTab = 'food';
  var city = currentCity;
  document.getElementById('drawerName').textContent = city.name;
  document.getElementById('drawerName').style.color = city.color;
  var iconMap = {datong:'🏛',xinzhou:'🏔',taiyuan:'🔪',changzhi:'🌿',linfen:'💧',yuncheng:'🧂'};
  var bgMap   = {datong:'#fff4ef',xinzhou:'#eff6ff',taiyuan:'#fffbef',changzhi:'#effff5',linfen:'#f5fff0',yuncheng:'#fff0f4'};
  document.getElementById('drawerIcon').textContent = iconMap[cityKey]||'📍';
  document.getElementById('drawerIcon').style.background = bgMap[cityKey]||'#f5f5f5';
  document.getElementById('drawerHint').textContent = city.hint;
  renderTabs();
  renderTabContent();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function renderTabs() {
  var html = '';
  TAB_CFG.forEach(function(tab){
    var arr = currentCity[tab.key]||[];
    if (!arr.length) return;
    var isActive = tab.key === currentTab;
    html += '<button class="tab-btn'+(isActive?' active':'')+'"'
      +(isActive?' style="background:'+currentCity.color+';border-color:'+currentCity.color+'"':'')
      +' onclick="switchTab(\''+tab.key+'\')" type="button">'+tab.label+'</button>';
  });
  document.getElementById('drawerTabs').innerHTML = html;
}

function switchTab(key) {
  currentTab = key;
  renderTabs();
  renderTabContent();
  document.getElementById('drawerBody').scrollTop = 0;
}

function renderTabContent() {
  var body = document.getElementById('drawerBody');
  if (currentTab==='trips') { renderTrips(body); return; }
  var items = currentCity[currentTab]||[];
  var tab = TAB_CFG.find(function(t){return t.key===currentTab;});
  if (!items.length) { body.innerHTML='<div style="text-align:center;color:#ccc;padding:40px 0;font-size:14px">暂无内容</div>'; return; }
  var cityColor = currentCity.color;
  var html = '';
  items.forEach(function(item){
    var ck = currentCity.key+':'+currentTab+':'+item.name;
    var checked = !!checkedItems[ck];
    html += '<div class="drawer-item'+(checked?' checked':'')+'" style="--city-color:'+cityColor+'" onclick="toggleItem(this,\''+ck.replace(/'/g,"\\'")+'\')">';
    html += '<div class="check-box">'+(checked?'✓':'')+'</div>';
    html += '<div><div class="item-name">'+item.name+'</div>'+(item.note?'<div class="item-note">'+item.note+'</div>':'')+'</div>';
    html += '</div>';
  });
  // 留言放在每个 tab 下面
  html += '<div id="commentSection" style="margin-top:8px"></div>';
  body.innerHTML = html;
  renderComments(currentCity.key);
}

function toggleItem(el, ck) {
  var box = el.querySelector('.check-box');
  if (checkedItems[ck]) {
    delete checkedItems[ck];
    el.classList.remove('checked');
    box.textContent = '';
  } else {
    checkedItems[ck] = true;
    el.classList.add('checked');
    box.textContent = '✓';
  }
  localStorage.setItem('shanxi_checked', JSON.stringify(checkedItems));
  updateBadge();
}

function renderTrips(body) {
  var trips = currentCity.trips||[];
  if (!trips.length) { body.innerHTML='<div style="text-align:center;color:#ccc;padding:40px 0;font-size:14px">行程规划整理中</div>'; return; }
  var html = '';
  trips.forEach(function(trip){
    html += '<div class="trip-title">'+trip.title+'</div>';
    trip.days.forEach(function(day,di){
      var dc = DAY_COLORS[di%DAY_COLORS.length];
      html += '<div class="trip-day">';
      html += '<div class="trip-day-header" style="background:'+dc+'">'+day.label+(day.theme?' · '+day.theme:'')+'</div>';
      day.items.forEach(function(item){
        var tc = TIME_COLORS[item.time]||'#888';
        html += '<div class="trip-item"><span class="trip-time" style="background:'+tc+'">'+item.time+'</span><span class="trip-text">'+item.text+'</span></div>';
      });
      html += '</div>';
    });
  });
  html += '<div id="commentSection" style="margin-top:8px"></div>';
  body.innerHTML = html;
  renderComments(currentCity.key);
}

/* ===== 留言 ===== */
function renderComments(cityKey) {
  var sec = document.getElementById('commentSection');
  if (!sec) return;
  var formHtml = '<div class="comment-section-title">💬 旅行者留言</div>';
  formHtml += '<div id="commentList"><div style="color:#aaa;font-size:12px;padding:4px 0 8px">加载中...</div></div>';

    formHtml += '<textarea class="comment-input" id="commentText" rows="3" placeholder="分享你的旅行经验..."></textarea>';
    formHtml += '<button class="comment-submit" id="commentSubmitBtn" onclick="submitComment()" type="button">发布</button>';
    formHtml += '<div style="clear:both;font-size:11px;color:#bbb;margin-top:8px">昵称：'+username+' <span style="color:#3a7a3a;cursor:pointer" onclick="showUsernameModal()">修改</span></div>';
  } else {
    formHtml += '<div class="login-bar">设置昵称后可以留言<button class="login-btn" onclick="showUsernameModal()" type="button">设置昵称</button></div>';
  }
  sec.innerHTML = formHtml;
  loadCommentList(cityKey);
}

function loadCommentList(cityKey) {
  fetch(SUPABASE_URL+'/rest/v1/comments?city=eq.'+encodeURIComponent(cityKey)+'&order=created_at.desc&limit=50',{
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
  }).then(function(r){return r.json();}).then(function(list){
    var el = document.getElementById('commentList');
    if (!el) return;
    if (!list.length){ el.innerHTML='<div style="color:#bbb;font-size:12px;padding:4px 0 8px">还没有留言，来第一个吧～</div>'; return; }
    var h = '';
    list.forEach(function(c){
      var t = new Date(c.created_at);
      var ts = (t.getMonth()+1)+'月'+t.getDate()+'日';
      h += '<div class="comment-card"><div class="comment-meta"><b>'+c.username+'</b>  '+ts+'</div>';
      h += '<div class="comment-text">'+c.content.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div></div>';
    });
    el.innerHTML = h;
  }).catch(function(){
    var el = document.getElementById('commentList');
    if (el) el.innerHTML='<div style="color:#aaa;font-size:12px">留言加载失败</div>';
  });
}

async function submitComment() {
  var ta = document.getElementById('commentText');
  if (!ta||!ta.value.trim()) return;
  var txt = ta.value.trim();
  if (txt.length>500){alert('留言不能超过500字');return;}
  var btn = document.getElementById('commentSubmitBtn');
  if (btn){ btn.disabled=true; btn.textContent='审核中...'; }

  // AI 审核
  try {
    var auditResp = await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+DEEPSEEK_KEY},
      body:JSON.stringify({
        model:'deepseek-chat',
        messages:[{role:'user',content:'你是旅游攻略社区的内容审核员。拦截标准：①含广告推销；②人身攻击或骂人；③政治敏感；④低俗色情；⑤无意义刷屏（如"测试""123""aaa"）；⑥负面情绪发泄与旅游无关（如"真坏啊""好烦"）。以下情况允许通过：正面情感表达（"好棒""太美了""强烈推荐"）、旅游相关分享、简短实用建议。只返回JSON：{"pass":true/false,"reason":"一句话说明原因"}\n留言内容：'+txt}],
        max_tokens:100, temperature:0
      })
    });
    var auditData = await auditResp.json();
    var auditText = auditData.choices[0].message.content.trim();
    var auditJson = JSON.parse(auditText.replace(/```json|```/g,'').trim());
    if (!auditJson.pass) {
      if (btn){ btn.disabled=false; btn.textContent='发布'; }
      alert('留言未通过审核：' + (auditJson.reason||'内容不合规，请修改后重新发布'));
      return;
    }
  } catch(e) {
    // 审核接口异常时放行（降级处理）
    console.warn('AI审核异常，降级放行', e);
  }

  // 审核通过，写入 Supabase
  fetch(SUPABASE_URL+'/rest/v1/comments',{
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({city:currentCity.key,username:username,content:txt})

    if (r.ok){ ta.value=''; loadCommentList(currentCity.key); }
    else r.text().then(function(e){alert('发布失败：'+e);});
  }).catch(function(){ if(btn){ btn.disabled=false; btn.textContent='发布'; } alert('网络错误，请重试'); });
}

/* ===== AI 行程生成 ===== */
function generateGlobalItinerary() {
  var origin = document.getElementById('pfOrigin').value.trim();
  var date = document.getElementById('pfDate').value;
  var days = parseInt(document.getElementById('pfDays').value)||3;
  if (!origin){alert('请填写出发地');return;}
  if (!date){alert('请选择出发日期');return;}

  var cityItems = {};
  var nameMap = {};
  CITIES.forEach(function(c){ nameMap[c.key]=c.name; });
  Object.keys(checkedItems).forEach(function(k){
    var p=k.split(':'); var city=p[0];
    if (!cityItems[city]) cityItems[city]=[];
    cityItems[city].push(p[2]);
  });
  var cityOrder = CITIES.map(function(c){return c.key;});
  var cityList = cityOrder.filter(function(c){return cityItems[c]&&cityItems[c].length;});
  if (!cityList.length){alert('请先勾选想去的地方～');return;}
  var itemDesc = cityList.map(function(c){return nameMap[c]+'：'+cityItems[c].join('、');}).join('；');

  closePlanForm();
  document.getElementById('aiModalTitle').textContent = '✨ AI 行程规划';
  document.getElementById('aiModalBody').innerHTML = '<div style="color:#888;padding:20px 0;text-align:center">🤔 AI规划中，通常需要10秒左右...</div>';
  document.getElementById('aiModalOverlay').classList.add('open');

  var prompt = '你是专业山西旅行规划师。根据以下信息生成行程，只输出JSON数组，不要任何其他文字或代码块标记。\n出发地：'+origin+'\n出发日期：'+date+'\n总天数：'+days+'天\n已选内容：'+itemDesc+'\n\n格式（严格JSON数组）：[{"day":1,"date":"5/20 周二","city":"大同","theme":"云冈石窟·古城","slots":[{"time":"交通","icon":"🚆","title":"出发","desc":"交通方式+时长+票价","tip":"实用建议"},{"time":"上午","icon":"🏛","title":"云冈石窟","desc":"重点看第20窟大佛，游览约2小时","tip":"早去人少"}]}]\n\n要求：\n1. 第1天第一个slot必须是从'+origin+'到第一个城市的交通slot\n2. 城市间转场必须有交通slot（time字段写"交通"）\n3. 同城景点间在desc里说明距离/方式\n4. 每天4-5个slot（上午/中午/下午/晚上）\n5. tip字段口语化一句话';

  fetch('https://api.deepseek.com/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+DEEPSEEK_KEY},
    body:JSON.stringify({model:'deepseek-chat',messages:[{role:'user',content:prompt}],max_tokens:2000,temperature:0.7})
  }).then(function(r){return r.json();}).then(function(d){
    var raw = d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
    if (!raw){document.getElementById('aiModalBody').textContent='生成失败，请重试';return;}
    try {
      var jsonStr = raw.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
      var plan = JSON.parse(jsonStr);
      document.getElementById('aiModalBody').innerHTML = renderPlanCards(plan);
    } catch(e) {
      document.getElementById('aiModalBody').innerHTML='<pre style="white-space:pre-wrap;font-size:13px;line-height:1.7">'+raw+'</pre>';
    }
  }).catch(function(){ document.getElementById('aiModalBody').textContent='网络错误，请重试'; });
}

function renderPlanCards(plan) {
  var html='<div style="padding:4px 0">';
  plan.forEach(function(day,di){
    var color=DAY_COLORS[di%DAY_COLORS.length];
    html+='<div style="margin-bottom:20px">';
    html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">';
    html+='<div style="background:'+color+';color:#fff;border-radius:20px;padding:4px 14px;font-size:13px;font-weight:700">Day '+day.day+' · '+(day.date||'')+'</div>';
    html+='<div style="font-size:13px;color:#555;flex:1">'+(day.city||'')+'</div></div>';
    if (day.theme) html+='<div style="font-size:12px;color:#888;margin:-6px 0 10px 4px">✦ '+day.theme+'</div>';
    if (day.slots) day.slots.forEach(function(slot){
      var tc=TIME_COLORS[slot.time]||'#f8f8f8';
      html+='<div style="display:flex;gap:10px;margin-bottom:8px;align-items:flex-start">';
      html+='<div style="display:flex;flex-direction:column;align-items:center;padding-top:3px"><div style="width:8px;height:8px;border-radius:50%;background:'+color+';flex-shrink:0"></div><div style="width:2px;flex:1;background:#e0e0e0;margin-top:3px;min-height:24px"></div></div>';
      html+='<div style="flex:1;background:#f8f8f8;border-radius:12px;padding:10px 12px">';
      html+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">';
      html+='<span style="font-size:11px;color:#fff;background:'+color+';border-radius:6px;padding:2px 7px;flex-shrink:0;font-weight:600">'+(slot.time||'')+'</span>';
      html+='<span style="font-size:18px">'+(slot.icon||'📍')+'</span>';
      html+='<span style="font-size:14px;font-weight:600;color:#222">'+(slot.title||'')+'</span></div>';
      if (slot.desc) html+='<div style="font-size:13px;color:#444;line-height:1.6;margin-bottom:4px">'+slot.desc+'</div>';
      if (slot.tip) html+='<div style="font-size:11px;color:#888;background:rgba(0,0,0,.04);border-radius:6px;padding:4px 8px">💡 '+slot.tip+'</div>';
      html+='</div></div>';
    });
    html+='</div>';
  });
  return html+'</div>';
}
